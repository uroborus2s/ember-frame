<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0067b8"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8f8f2"/>
  <text x="40" y="48" font-family="Arial" font-size="26" fill="#222">P-03 control-only blocking: white-wall voice screening</text>
  <text x="40" y="78" font-family="Arial" font-size="16" fill="#555">Final frame must stay clean and frontal. Do not render labels, arrows, or IDs.</text>
  <rect x="90" y="130" width="1020" height="150" fill="#fdfdf9" stroke="#cfcfc8" stroke-width="5"/>
  <text x="485" y="215" font-family="Arial" font-size="26" fill="#888">large white wall negative space</text>
  <line x1="130" y1="485" x2="575" y2="485" stroke="#8c8c82" stroke-width="4"/>
  <text x="190" y="455" font-family="Arial" font-size="18" fill="#111">child queue on one straight line</text>
  <circle cx="150" cy="485" r="16" fill="#deded6"/><circle cx="205" cy="485" r="16" fill="#deded6"/><circle cx="260" cy="485" r="16" fill="#deded6"/><circle cx="315" cy="485" r="16" fill="#deded6"/><circle cx="370" cy="485" r="16" fill="#deded6"/><circle cx="425" cy="485" r="16" fill="#deded6"/><circle cx="480" cy="485" r="16" fill="#deded6"/>
  <circle cx="605" cy="455" r="18" fill="#e5e5dd"/>
  <text x="565" y="425" font-family="Arial" font-size="17" fill="#111">tested child, same age scale</text>
  <rect x="670" y="390" width="210" height="95" fill="#ffffff" stroke="#a0a0a0" stroke-width="4"/>
  <text x="705" y="450" font-family="Arial" font-size="18" fill="#111">testing desk</text>
  <circle cx="760" cy="365" r="13" fill="#f0d15a"/>
  <text x="720" y="350" font-family="Arial" font-size="16" fill="#111">yellowing wax sample</text>
  <circle cx="920" cy="445" r="17" fill="#ededec"/>
  <text x="888" y="415" font-family="Arial" font-size="17" fill="#111">white child observer</text>
  <circle cx="1010" cy="475" r="18" fill="#50575f"/>
  <circle cx="1060" cy="475" r="18" fill="#50575f"/>
  <circle cx="1040" cy="545" r="18" fill="#8c7d6d"/>
  <text x="945" y="590" font-family="Arial" font-size="17" fill="#111">mother at side wall, not center</text>
  <path d="M600 610 C640 570,690 520,740 480" fill="none" stroke="#0067b8" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="420" y="640" font-family="Arial" font-size="18" fill="#0067b8">camera fixed frontal; movement is minimal</text>
  <text x="40" y="735" font-family="Arial" font-size="18" fill="#111">Height lock: all queued children similar short scale; white observer remains childlike; clerks/guards adult height; no monster/priest silhouette.</text>
