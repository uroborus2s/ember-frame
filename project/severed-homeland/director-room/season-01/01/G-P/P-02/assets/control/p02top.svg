<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f5f0df"/>
  <text x="40" y="48" font-family="Arial" font-size="26" fill="#222">P-02 control-only top view: kitchen levy process</text>
  <text x="40" y="78" font-family="Arial" font-size="16" fill="#555">Final frame must show procedure, not robbery. Do not render labels or arrows.</text>
  <rect x="120" y="130" width="900" height="560" fill="#d5c8ad" stroke="#483a2d" stroke-width="5"/>
  <rect x="120" y="300" width="210" height="250" fill="#7d6a52" stroke="#3e3429" stroke-width="4"/>
  <text x="150" y="426" font-family="Arial" font-size="20" fill="#111">stove origin</text>
  <ellipse cx="360" cy="585" rx="150" ry="45" fill="#6b5845" opacity="0.65"/>
  <text x="265" y="640" font-family="Arial" font-size="18" fill="#111">wheat + muddy water foreground</text>
  <rect x="745" y="130" width="150" height="75" fill="#b9c7d7" stroke="#4b5b6a" stroke-width="3"/>
  <text x="730" y="115" font-family="Arial" font-size="18" fill="#111">cold doorway</text>
  <rect x="545" y="250" width="230" height="120" fill="#8c7357" stroke="#3e3024" stroke-width="4"/>
  <text x="595" y="315" font-family="Arial" font-size="18" fill="#111">clerk + ledger</text>
  <rect x="600" y="455" width="210" height="105" fill="#e9e2cf" stroke="#71654a" stroke-width="4"/>
  <text x="615" y="520" font-family="Arial" font-size="18" fill="#111">wax board</text>
  <circle cx="515" cy="315" r="18" fill="#53606a"/>
  <text x="395" y="285" font-family="Arial" font-size="17" fill="#111">C016 clerk: seated / writing / smaller movement</text>
  <circle cx="805" cy="210" r="22" fill="#596066"/>
  <text x="815" y="236" font-family="Arial" font-size="17" fill="#111">C017 guard: doorway pressure</text>
  <circle cx="405" cy="505" r="18" fill="#8a7860"/>
  <text x="365" y="470" font-family="Arial" font-size="17" fill="#111">old villager near jar</text>
  <circle cx="880" cy="515" r="18" fill="#8a7860"/>
  <circle cx="935" cy="515" r="12" fill="#8a7860"/>
  <text x="842" y="560" font-family="Arial" font-size="17" fill="#111">mother + child at side</text>
