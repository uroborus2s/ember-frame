  <text x="730" y="395" font-family="Arial" font-size="18" fill="#b3261e">guard route stops at stove; no free-for-all fight</text>
  <path d="M280 420 C345 505,455 545,625 505" fill="none" stroke="#0067b8" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="420" y="600" font-family="Arial" font-size="18" fill="#0067b8">camera low: stove -> wheat/mud -> wax board -> ledger</text>
  <text x="40" y="735" font-family="Arial" font-size="18" fill="#111">Height/role lock: clerk seated lower, guard taller at doorway, old villager bent low, child smaller than mother; roles must not merge.</text>
</svg>
