<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f1e8"/>
  <text x="40" y="48" font-family="Arial" font-size="26" fill="#222">P-01 control-only top view: blackstone gate / platform / locked grain door</text>
  <text x="40" y="78" font-family="Arial" font-size="16" fill="#555">Do not render labels, arrows, blue lines, or IDs in final frame.</text>
  <rect x="80" y="150" width="1040" height="150" fill="#2c2c2c" stroke="#111" stroke-width="5"/>
  <rect x="500" y="130" width="200" height="190" fill="#171717" stroke="#777" stroke-width="4"/>
  <text x="512" y="225" font-family="Arial" font-size="18" fill="#f4f1e8">closed main gate</text>
  <rect x="130" y="420" width="230" height="95" fill="#2b2b2b" stroke="#111" stroke-width="4"/>
  <rect x="160" y="445" width="70" height="45" fill="#b68a3a" stroke="#2b1d08" stroke-width="2"/>
  <text x="138" y="540" font-family="Arial" font-size="18" fill="#111">locked grain door + sacks behind workers</text>
  <rect x="430" y="385" width="340" height="145" rx="12" fill="#b9b2a3" stroke="#5f584b" stroke-width="4"/>
  <text x="500" y="465" font-family="Arial" font-size="20" fill="#111">inner platform</text>
  <rect x="520" y="560" width="260" height="70" fill="#6f5c45" stroke="#2d241b" stroke-width="4"/>
  <circle cx="560" cy="595" r="26" fill="#464646"/>
  <circle cx="740" cy="595" r="26" fill="#464646"/>
  <text x="555" y="655" font-family="Arial" font-size="18" fill="#111">ballista / winch</text>
  <circle cx="490" cy="440" r="14" fill="#3f4a50"/><circle cx="560" cy="430" r="14" fill="#3f4a50"/><circle cx="635" cy="430" r="14" fill="#3f4a50"/><circle cx="705" cy="445" r="14" fill="#3f4a50"/>
  <text x="468" y="370" font-family="Arial" font-size="18" fill="#111">gray-wall workers: same scale, exhausted, non-heroic</text>
  <circle cx="420" cy="625" r="18" fill="#49565d"/>
  <text x="250" y="625" font-family="Arial" font-size="18" fill="#111">teen worker at winch, foreground</text>
  <line x1="600" y1="95" x2="600" y2="130" stroke="#b3261e" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="645" y="100" font-family="Arial" font-size="18" fill="#b3261e">outside pressure only from gate side</text>
  <path d="M640 310 C620 340,600 365,590 390" fill="none" stroke="#0067b8" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="650" y="360" font-family="Arial" font-size="18" fill="#0067b8">camera low, compressed toward gate and grain door</text>
  <rect x="830" y="425" width="160" height="70" fill="#7c7668" stroke="#332c22" stroke-width="3"/>
  <text x="820" y="525" font-family="Arial" font-size="18" fill="#111">bell overhead in camera view, not a second gate</text>
  <text x="40" y="735" font-family="Arial" font-size="18" fill="#111">Height/scale lock: teen worker shorter than adult workers; all workers human scale; gate massive; grain door behind them stays closed.</text>
</svg>
