<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4eee6"/>
  <text x="40" y="48" font-family="Arial" font-size="26" fill="#222">P-04 control-only top view: red-thread room / rain eaves axis</text>
  <text x="40" y="78" font-family="Arial" font-size="16" fill="#555">Motion vs stillness: Yanzhi moves to rear door; Bai Yi stays under eaves.</text>
  <rect x="110" y="130" width="760" height="520" fill="#3a2a24" stroke="#1b1310" stroke-width="5"/>
  <rect x="175" y="445" width="455" height="135" fill="#5b372f" stroke="#23120e" stroke-width="4"/>
  <text x="320" y="520" font-family="Arial" font-size="20" fill="#f6e6d2">red-thread table</text>
  <line x1="190" y1="460" x2="610" y2="565" stroke="#b3261e" stroke-width="5"/>
  <line x1="225" y1="575" x2="610" y2="455" stroke="#b3261e" stroke-width="4"/>
  <line x1="250" y1="500" x2="570" y2="500" stroke="#b3261e" stroke-width="3"/>
  <rect x="695" y="190" width="120" height="165" fill="#0e0d0d" stroke="#6a5a49" stroke-width="4"/>
  <text x="693" y="175" font-family="Arial" font-size="18" fill="#111">rear door to rain</text>
  <rect x="880" y="130" width="210" height="520" fill="#c8d6e2" stroke="#4e6070" stroke-width="4" opacity="0.8"/>
  <text x="910" y="175" font-family="Arial" font-size="18" fill="#111">rain eaves zone</text>
  <circle cx="500" cy="350" r="18" fill="#7b6170"/>
  <text x="345" y="330" font-family="Arial" font-size="18" fill="#111">Yanzhi: moving, upright, not helpless</text>
  <path d="M500 350 C600 315,680 265,745 245" fill="none" stroke="#b3261e" stroke-width="6" marker-end="url(#arrow)"/>
  <circle cx="980" cy="345" r="22" fill="#f3f0e8" stroke="#aaa" stroke-width="3"/>
  <text x="925" y="385" font-family="Arial" font-size="18" fill="#111">Bai Yi: still, white-book action</text>
  <circle cx="740" cy="475" r="14" fill="#222"/>
  <text x="720" y="505" font-family="Arial" font-size="16" fill="#111">box / fragment close-up zone</text>
  <path d="M910 520 C790 500,690 530,610 565" fill="none" stroke="#0067b8" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="700" y="620" font-family="Arial" font-size="18" fill="#0067b8">camera tracks Yanzhi, then cuts to Bai Yi stillness</text>
  <text x="40" y="735" font-family="Arial" font-size="18" fill="#111">Height/identity lock: Yanzhi slim and upright; Bai Yi taller/cleaner/still; guards remain background silhouettes; no monster or wuxia fight staging.</text>
