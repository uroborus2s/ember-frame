interface:
  display_name: "故事原著部"
  short_description: "用作家团队把故事梗创作成完整、有文学魅力的小说原著"
  default_prompt: "使用故事原著部，先交互式获取故事需求、风格边界和作品想传达的思想能量，并建立 story-original/bible/story-bible.md 作为唯一创作前提；采用总小说家主笔制，核心职能是总小说家主笔、Bible 前提锁定、故事医生质检，中大型任务再按需调用故事架构、人物心理、悬念高潮、场景沉浸、草稿助手、经验整理等后台顾问；公开小说正文必须由总小说家统一灵魂、文风、思想能量和最终文字，不能拆成多人流水线拼贴。以作家的敬畏和责任创作或回补完整小说原著。对外只交小说正文，后台大纲、质检、人物内驱和改编交接写入隐藏工作目录。"
